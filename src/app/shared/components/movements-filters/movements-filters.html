<div [formGroup]="form" class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">

  <div class="grid grid-cols-1 gap-3 md:grid-cols-2 lg:grid-cols-4">

    <!-- Rango de fecha (preset) -->
    <div>
      <label for="dateRange" class="mb-2 block text-xs font-medium text-gray-600">
        Rango de fecha
      </label>
      <div class="relative">
        <select
          id="dateRange"
          formControlName="dateRange"
          class="w-full cursor-pointer appearance-none rounded-lg border border-gray-300 bg-white px-3 py-2 pr-9 text-sm text-gray-800 transition hover:border-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
        >
          @for (option of dateRangeOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        <span class="pointer-events-none absolute inset-y-0 right-2 flex items-center text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </span>
      </div>
    </div>

    <!-- Categoría -->
    <div>
      <label for="categoryId" class="mb-2 block text-xs font-medium text-gray-600">
        Categoría
      </label>
      <div class="relative">
        <select
          id="categoryId"
          formControlName="categoryId"
          class="w-full cursor-pointer appearance-none rounded-lg border border-gray-300 bg-white px-3 py-2 pr-9 text-sm text-gray-800 transition hover:border-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
        >
          <option value="all">Todas</option>
          @for (category of categories(); track category.id) {
            <option [value]="category.id">{{ category.name }}</option>
          }
        </select>
        <span class="pointer-events-none absolute inset-y-0 right-2 flex items-center text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </span>
      </div>
    </div>

    <!-- Búsqueda -->
    <div>
      <label for="search" class="mb-2 block text-xs font-medium text-gray-600">
        Buscar
      </label>
      <input
        id="search"
        type="text"
        formControlName="search"
        placeholder="Descripción..."
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
      />
    </div>

    <!-- Botón limpiar -->
    <div class="flex items-end">
      <button
        type="button"
        (click)="onClear()"
        class="w-full cursor-pointer rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-50"
      >
        Limpiar filtros
      </button>
    </div>

  </div>

  <!-- Rango personalizado (solo si dateRange === 'custom') -->
  @if (form.controls.dateRange.value === 'custom') {
    <div class="mt-3 grid grid-cols-1 gap-3 border-t border-gray-100 pt-3 md:grid-cols-2">

      <div>
        <label for="dateFrom" class="mb-2 block text-xs font-medium text-gray-600">
          Desde
        </label>
        <input
          id="dateFrom"
          type="date"
          formControlName="dateFrom"
          [max]="today"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        />
      </div>

      <div>
        <label for="dateTo" class="mb-2 block text-xs font-medium text-gray-600">
          Hasta
        </label>
        <input
          id="dateTo"
          type="date"
          formControlName="dateTo"
          [max]="today"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        />
      </div>

    </div>
  }

</div>
