<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
  <div>
    <label for="name" class="mb-2 block text-sm font-medium text-gray-700"> Nombre </label>
    <input
      id="name"
      type="text"
      formControlName="name"
      placeholder="Ej: Comida, Salario, Transporte..."
      class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
      [class.border-red-500]="FormUtils.isValidField(form, 'name')"
    />
    @if (FormUtils.isValidField(form, 'name')) {
      <p class="mt-1 text-xs text-red-600">
        {{ FormUtils.getFieldError(form, 'name') }}
      </p>
    }
  </div>

  <div>
    <label for="type" class="mb-2 block text-sm font-medium text-gray-700"> Tipo </label>

    <div class="relative">
      <select
        id="type"
        formControlName="type"
        class="w-full cursor-pointer appearance-none rounded-lg border border-gray-300 bg-white px-4 py-2.5 pr-10 text-sm text-gray-800 transition hover:border-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
        [class.border-red-500]="FormUtils.isValidField(form, 'type')"
        [class.hover:border-red-500]="FormUtils.isValidField(form, 'type')"
      >
        <option value="ingreso">Ingreso</option>
        <option value="gasto">Gasto</option>
      </select>

      <!-- Chevron personalizado -->
      <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-400">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>
      </span>
    </div>

    @if (FormUtils.isValidField(form, 'type')) {
      <p class="mt-1 text-xs text-red-600">
        {{ FormUtils.getFieldError(form, 'type') }}
      </p>
    }
  </div>

  <div class="flex justify-end gap-2 pt-2">
    <button
      type="button"
      (click)="onCancel()"
      class="cursor-pointer rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
    >
      Cancelar
    </button>

    <button
      type="submit"
      class="cursor-pointer rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700"
    >
      {{ isEditMode() ? 'Guardar cambios' : 'Crear categoría' }}
    </button>
  </div>
</form>
