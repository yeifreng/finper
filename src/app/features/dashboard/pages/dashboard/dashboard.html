<div class="flex min-h-screen flex-col">
  <div class="flex min-h-0 flex-1">
    <!-- sidebar -->
     <aside class="fixed inset-y-0 left-0 z-50 flex w-60 flex-col overflow-hidden bg-gray-950 p-4 text-white shadow-lg transition-transform duration-300 lg:static lg:z-auto lg:transition-[width] lg:duration-300"
          [class.-translate-x-full]="!isSidebarOpen()"
          [class.translate-x-0]="isSidebarOpen()"
          [class.lg:w-0]="!isSidebarOpen()"
          [class.lg:w-60]="isSidebarOpen()"
          [class.lg:p-0]="!isSidebarOpen()"
          [class.lg:p-4]="isSidebarOpen()">

      <app-sidebar
        class="flex-1"
        [isSidebarOpen]="isSidebarOpen()">
      </app-sidebar>

    </aside>

    <div
      class="fixed inset-0 z-40 bg-black/50 lg:hidden"
      [class.hidden]="!isSidebarOpen()"
      (click)="isSidebarOpen.set(false)">
    </div>

    <div class="flex min-w-0 flex-1 flex-col gap-4">
      <!-- main-->
      <app-menu
        (toggleSidebar)="toggleSidebar()">
      </app-menu>

      <!-- Card -->

      <main class="flex-1 p-4">

        <!-- Dashboard header -->
        <div class="mb-6">
          <h2 class="text-2xl font-bold text-gray-800">Buen día, Yeifren 👋</h2>
          <p class="mt-1 text-sm text-gray-500">Aquí tienes un resumen de tus finanzas.</p>
        </div>

        <!-- CARDS -->
        <app-card></app-card>

        <!-- GRAPHS -->
        <div class="mt-4 grid grid-cols-1 gap-6 lg:grid-cols-2">
          <app-chart></app-chart>
          <app-category-list></app-category-list>
        </div>

        <!-- RECENT MOVEMENTS -->
        <div class="mt-6 rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
          <app-movements></app-movements>
        </div>
      </main>
    </div>
  </div>
  <app-footer></app-footer>
</div>
