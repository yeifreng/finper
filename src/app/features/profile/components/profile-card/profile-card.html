<div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">

  <!-- User information -->
  <div class="flex flex-col items-center px-6 py-8">
    <div
      class="flex h-24 w-24 items-center justify-center rounded-full bg-blue-100 text-3xl font-bold text-blue-600 ring-4 ring-blue-50"
    >
      {{ profile().firstName.charAt(0).toUpperCase() || 'U' }}
    </div>

    <h3 class="mt-4 text-lg font-bold text-gray-800">
      {{ profile().firstName }} {{ profile().lastName }}
    </h3>

    <p class="mt-1 text-sm text-gray-500">
      {{ profile().email }}
    </p>
  </div>

  <!-- Menu -->
  <nav class="border-t border-gray-200">

    <button
      type="button"
      (click)="sectionChange.emit('profile')"
      class="flex w-full cursor-pointer items-center gap-3 border-l-4 px-6 py-4 text-left text-sm transition"
      [class.border-blue-600]="activeSection() === 'profile'"
      [class.bg-blue-50]="activeSection() === 'profile'"
      [class.font-semibold]="activeSection() === 'profile'"
      [class.text-blue-700]="activeSection() === 'profile'"
      [class.border-transparent]="activeSection() !== 'profile'"
      [class.text-gray-600]="activeSection() !== 'profile'"
      [class.hover:bg-gray-50]="activeSection() !== 'profile'"
      [class.hover:text-gray-800]="activeSection() !== 'profile'"
    >
      <span class="text-lg">✏️</span>
      <span>Editar perfil</span>
    </button>

    <button
      type="button"
      (click)="sectionChange.emit('security')"
      class="flex w-full cursor-pointer items-center gap-3 border-l-4 px-6 py-4 text-left text-sm transition"
      [class.border-blue-600]="activeSection() === 'security'"
      [class.bg-blue-50]="activeSection() === 'security'"
      [class.font-semibold]="activeSection() === 'security'"
      [class.text-blue-700]="activeSection() === 'security'"
      [class.border-transparent]="activeSection() !== 'security'"
      [class.text-gray-600]="activeSection() !== 'security'"
      [class.hover:bg-gray-50]="activeSection() !== 'security'"
      [class.hover:text-gray-800]="activeSection() !== 'security'"
    >
      <span class="text-lg">🔒</span>
      <span>Seguridad</span>
    </button>

  </nav>
</div>
